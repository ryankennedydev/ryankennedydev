<svg width="420"
  height="420" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="480" height="420" rx="14" fill="url(#bg3)" stroke="#00E5FF" stroke-opacity="0.35"/>

  <rect x="0" y="0" width="480" height="34" rx="14" fill="#0a0f16"/>
  <rect x="0" y="20" width="480" height="14" fill="#0a0f16"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5" fill="#27c93f"/>
  <text x="240" y="21" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#6b7785">ryankennedy@neural-net: ~/whoami</text>

  <g font-family="Fira Code, monospace" fill="#00E5FF" filter="url(#glow3)">
    <text x="24" y="66" font-size="14">$ ./identity.sh</text>
    <text x="24" y="90" font-size="13" fill="#e6f7ff">Ryan Kennedy</text>
    <text x="24" y="110" font-size="12" fill="#7fd8ff">Computer Science Student</text>

    <text x="24" y="142" font-size="14">$ cat stack.json</text>
    <text x="34" y="164" font-size="12" fill="#e6f7ff">"stack": [React, JS, Node, Python, HTML/CSS]</text>
    <text x="34" y="184" font-size="12" fill="#e6f7ff">"db": [MongoDB, SQLite]</text>
    <text x="34" y="204" font-size="12" fill="#e6f7ff">"focus": ["Artificial Intelligence"]</text>

    <text x="24" y="236" font-size="14">$ ping curiosity</text>
    <text x="34" y="258" font-size="12" fill="#e6f7ff">64 bytes from cs-fundamentals: time=∞</text>
    <text x="34" y="278" font-size="12" fill="#e6f7ff">64 bytes from side-projects: time=always</text>

    <text x="24" y="310" font-size="14">$ whoami --links</text>
    <text x="34" y="332" font-size="12" fill="#e6f7ff">github.com/ryankennedydev</text>

    <text x="24" y="386" font-size="13" fill="#39ff88">$ status: always building and shipping_</text>
  </g>

  <rect x="228" y="376" width="8" height="14" fill="#39ff88">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
