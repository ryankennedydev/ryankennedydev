<svg width="480" height="420" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ryankennedy@neural-net: ~/whoami</title>
  <desc id="d">Terminal estilizado. Ryan Kennedy, estudante de Ciência da Computação. Stack: React, JS, Node, Python, HTML/CSS. Bancos de dados: MongoDB e SQL. Foco: Inteligência Artificial. GitHub: github.com/ryankennedydev. Status: sempre construindo e entregando.</desc>

  <style>
    /* ===== TOKENS (mesma paleta do banner e do identity scan) ===== */
    svg {
      --c-bg-0:#0d1626; --c-bg-1:#050709; --c-bar:#0a0f16; --c-border:#00E5FF;
      --c-accent:#00E5FF; --c-accent-hi:#7DF9FF; --c-violet:#B06CFF;
      --c-text:#e6f7ff; --c-text-dim:#8fa3b8; --c-ok:#39ff88;
      --c-dot-r:#ff5f56; --c-dot-y:#ffbd2e; --c-dot-g:#27c93f;
      --font-mono:'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --fs-title:11px; --fs-cmd:14px; --fs-out:12.5px;
    }
    .t       { font-family:var(--font-mono) }
    .titlebar{ fill:var(--c-bar) }
    .divider { stroke:var(--c-border); stroke-opacity:.15 }
    .win     { font-size:var(--fs-title); fill:var(--c-text-dim) }
    .prompt  { fill:var(--c-accent); filter:url(#glow) }
    .cmd     { font-size:var(--fs-cmd); fill:var(--c-accent-hi) }
    .out     { font-size:var(--fs-out); fill:var(--c-text) }
    .name    { font-size:14px; font-weight:700; fill:var(--c-text) }
    .role    { font-size:var(--fs-out); fill:var(--c-accent-hi) }
    .key     { fill:var(--c-accent) }
    .str     { fill:var(--c-text) }
    .dim     { fill:var(--c-text-dim) }
    .ok      { font-size:var(--fs-cmd); fill:var(--c-ok); filter:url(#glow) }
    .cursor  { fill:var(--c-ok); animation:blink 1s steps(1) infinite }

    /* ===== MOTION: digitação em sequência, executa uma vez ===== */
    .typed   { animation:none }
    .c1{clip-path:url(#k1)} .c2{clip-path:url(#k2)} .c3{clip-path:url(#k3)}
    .c4{clip-path:url(#k4)} .c5{clip-path:url(#k5)}
    clipPath rect { animation:type var(--d) steps(var(--n)) var(--t) both }
    .show    { opacity:0; animation:show .35s ease-out var(--t) forwards }
    @keyframes type  { from{width:0} to{width:440px} }
    @keyframes show  { from{opacity:0;transform:translateX(-4px)} to{opacity:1;transform:none} }
    @keyframes blink { 50%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      clipPath rect,.show,.cursor { animation:none }
      .c1,.c2,.c3,.c4,.c5 { clip-path:none }
      .show { opacity:1 }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--c-bg-0)"/>
      <stop offset="1" style="stop-color:var(--c-bg-1)"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- máscaras de digitação (uma por comando) -->
    <clipPath id="k1"><rect x="20" y="50"  width="440" height="22" style="--t:.3s;--d:.9s;--n:15"/></clipPath>
    <clipPath id="k2"><rect x="20" y="126" width="440" height="22" style="--t:2.0s;--d:1s;--n:16"/></clipPath>
    <clipPath id="k3"><rect x="20" y="220" width="440" height="22" style="--t:4.1s;--d:.9s;--n:15"/></clipPath>
    <clipPath id="k4"><rect x="20" y="294" width="440" height="22" style="--t:5.8s;--d:1s;--n:16"/></clipPath>
    <clipPath id="k5"><rect x="20" y="346" width="440" height="22" style="--t:7.5s;--d:1.4s;--n:38"/></clipPath>
  </defs>

  <!-- Janela -->
  <rect x=".5" y=".5" width="479" height="419" rx="14" fill="url(#bg)" stroke="#00E5FF" stroke-opacity=".35"/>
  <path class="titlebar" d="M1 34V14a13 13 0 0 1 13-13h452a13 13 0 0 1 13 13v20z"/>
  <line class="divider" x1="1" y1="34" x2="479" y2="34"/>
  <circle cx="20" cy="17" r="5" style="fill:var(--c-dot-r)"/>
  <circle cx="38" cy="17" r="5" style="fill:var(--c-dot-y)"/>
  <circle cx="56" cy="17" r="5" style="fill:var(--c-dot-g)"/>
  <text class="t win" x="240" y="21" text-anchor="middle">ryankennedy@neural-net: ~/whoami</text>

  <!-- 1. identidade -->
  <text class="t cmd c1" x="24" y="66"><tspan class="prompt">$</tspan> ./identity.sh</text>
  <text class="t name show" style="--t:1.2s" x="24" y="90">Ryan Kennedy</text>
  <text class="t role show" style="--t:1.4s" x="24" y="110">Computer Science Student</text>

  <!-- 2. stack -->
  <text class="t cmd c2" x="24" y="142"><tspan class="prompt">$</tspan> cat stack.json</text>
  <text class="t out show" style="--t:3.1s" x="34" y="164"><tspan class="key">"stack"</tspan><tspan class="dim">:</tspan> ["React", "JS", "Node", "Python", "HTML/CSS"]</text>
  <text class="t out show" style="--t:3.3s" x="34" y="184"><tspan class="key">"db"</tspan><tspan class="dim">:</tspan> ["MongoDB", "SQL"]</text>
  <text class="t out show" style="--t:3.5s" x="34" y="204"><tspan class="key">"focus"</tspan><tspan class="dim">:</tspan> ["Artificial Intelligence"]</text>

  <!-- 3. ping -->
  <text class="t cmd c3" x="24" y="236"><tspan class="prompt">$</tspan> ping curiosity</text>
  <text class="t out show" style="--t:5.1s" x="34" y="258"><tspan class="dim">64 bytes from</tspan> cs-fundamentals<tspan class="dim">: time=</tspan>∞</text>
  <text class="t out show" style="--t:5.3s" x="34" y="278"><tspan class="dim">64 bytes from</tspan> side-projects<tspan class="dim">: time=</tspan>always</text>

  <!-- 4. links -->
  <text class="t cmd c4" x="24" y="310"><tspan class="prompt">$</tspan> whoami --links</text>
  <text class="t out show" style="--t:6.9s" x="34" y="332">github.com/ryankennedydev</text>

  <!-- 5. status + novo prompt com cursor -->
  <text class="t ok c5" x="24" y="362">$ status: always building and shipping</text>
  <text class="t cmd show" style="--t:9s" x="24" y="392"><tspan class="prompt">$</tspan> <tspan class="cursor">█</tspan></text>
</svg>
