<svg width="900" height="260" viewBox="0 0 900 260"
xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>

    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#101e2d"/>
      <stop offset="45%" stop-color="#08111a"/>
      <stop offset="100%" stop-color="#030507"/>
    </radialGradient>

    <!-- Cyan glow -->
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF"/>
      <stop offset="45%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DF9FF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4DA8FF"/>
    </linearGradient>

    <!-- Data line -->
    <linearGradient id="lineGradient">
      <stop offset="0%" stop-color="#003B55"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#003B55"/>
    </linearGradient>

    <!-- Frame gradient -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft text glow -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#00E5FF"
        stroke-width="0.4"
        opacity="0.08"/>
    </pattern>

  </defs>


  <!-- BACKGROUND -->

  <rect width="900" height="260" fill="url(#bg)"/>

  <rect width="900" height="260" fill="url(#grid)"/>

  <!-- OUTER FRAME -->

  <rect x="2" y="2" width="896" height="256" rx="10"
    fill="none" stroke="url(#frameGradient)" stroke-width="1.4"/>

  <!-- CORNER BRACKETS -->

  <g stroke="#00E5FF" stroke-width="1.6" opacity="0.75" fill="none">
    <path d="M14,30 L14,14 L30,14"/>
    <path d="M886,30 L886,14 L870,14"/>
    <path d="M14,230 L14,246 L30,246"/>
    <path d="M886,230 L886,246 L870,246"/>
  </g>


  <!-- AMBIENT LIGHT -->

  <circle
    cx="450"
    cy="132"
    r="170"
    fill="#00E5FF"
    opacity="0.025">

    <animate
      attributeName="r"
      values="160;190;160"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- PARTICLES -->

  <g fill="#00E5FF" opacity="0.45">

    <circle cx="120" cy="42" r="1.2">
      <animate attributeName="opacity"
      values="0.1;0.8;0.1"
      dur="3s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="210" cy="222" r="1">
      <animate attributeName="opacity"
      values="0.2;1;0.2"
      dur="4s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="380" cy="38" r="1.3">
      <animate attributeName="opacity"
      values="0.1;0.9;0.1"
      dur="2.5s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="570" cy="228" r="1">
      <animate attributeName="opacity"
      values="0.1;0.8;0.1"
      dur="3.5s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="48" r="1.3">
      <animate attributeName="opacity"
      values="0.1;1;0.1"
      dur="4s"
      repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- TITLE -->

  <text
    x="450"
    y="34"
    text-anchor="middle"
    font-family="Fira Code, monospace"
    font-weight="700"
    font-size="21"
    letter-spacing="4"
    fill="url(#titleGradient)"
    filter="url(#textGlow)">
    RYAN.DEV
  </text>

  <text
    x="450"
    y="52"
    text-anchor="middle"
    font-family="Fira Code, monospace"
    font-size="9.5"
    letter-spacing="3"
    fill="#7FE9FF"
    opacity="0.6">
    // NEURAL NETWORK ARCHITECTURE
  </text>


  <!-- CONNECTIONS -->

  <g
    stroke="url(#lineGradient)"
    stroke-width="1.2"
    opacity="0.38">

    <!-- Layer 1 -->

    <line x1="90" y1="87" x2="260" y2="67"/>
    <line x1="90" y1="87" x2="260" y2="132"/>
    <line x1="90" y1="87" x2="260" y2="197"/>

    <line x1="90" y1="182" x2="260" y2="67"/>
    <line x1="90" y1="182" x2="260" y2="132"/>
    <line x1="90" y1="182" x2="260" y2="197"/>


    <!-- Layer 2 -->

    <line x1="260" y1="67" x2="450" y2="97"/>
    <line x1="260" y1="67" x2="450" y2="177"/>

    <line x1="260" y1="132" x2="450" y2="97"/>
    <line x1="260" y1="132" x2="450" y2="177"/>

    <line x1="260" y1="197" x2="450" y2="97"/>
    <line x1="260" y1="197" x2="450" y2="177"/>


    <!-- Layer 3 -->

    <line x1="450" y1="97" x2="650" y2="72"/>
    <line x1="450" y1="97" x2="650" y2="132"/>
    <line x1="450" y1="97" x2="650" y2="192"/>

    <line x1="450" y1="177" x2="650" y2="72"/>
    <line x1="450" y1="177" x2="650" y2="132"/>
    <line x1="450" y1="177" x2="650" y2="192"/>


    <!-- OUTPUT -->

    <line x1="650" y1="72" x2="810" y2="132"/>
    <line x1="650" y1="132" x2="810" y2="132"/>
    <line x1="650" y1="192" x2="810" y2="132"/>

  </g>


  <!-- ANIMATED SIGNALS -->

  <g fill="#FFFFFF" filter="url(#strongGlow)">

    <circle r="3">

      <animateMotion
        dur="3s"
        repeatCount="indefinite"

        path="
        M90,87
        L260,132
        L450,97
        L650,132
        L810,132"/>

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle r="2.5">

      <animateMotion
        dur="3.8s"
        begin="1s"
        repeatCount="indefinite"

        path="
        M90,182
        L260,197
        L450,177
        L650,192
        L810,132"/>

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="3.8s"
        begin="1s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- INPUT NODES -->

  <g filter="url(#glow)">

    <circle cx="90" cy="87" r="8" fill="url(#nodeGlow)">
      <animate
        attributeName="r"
        values="7;10;7"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="90" cy="182" r="8" fill="url(#nodeGlow)">
      <animate
        attributeName="r"
        values="7;10;7"
        dur="2.4s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- HIDDEN LAYER 1 -->

  <g fill="url(#nodeGlow)" filter="url(#glow)">

    <circle cx="260" cy="67" r="6"/>
    <circle cx="260" cy="132" r="7"/>
    <circle cx="260" cy="197" r="6"/>

  </g>


  <!-- CENTRAL AI CORE -->

  <g filter="url(#strongGlow)">

    <!-- Outer pulse -->

    <circle
      cx="450"
      cy="137"
      r="32"
      fill="none"
      stroke="#00E5FF"
      stroke-width="1"
      opacity="0.35">

      <animate
        attributeName="r"
        values="28;40;28"
        dur="3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.6;0;0.6"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Core -->

    <circle
      cx="450"
      cy="137"
      r="16"
      fill="#06131C"
      stroke="#00E5FF"
      stroke-width="2"/>

    <circle
      cx="450"
      cy="137"
      r="8"
      fill="url(#nodeGlow)">

      <animate
        attributeName="r"
        values="7;10;7"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- HIDDEN LAYER 2 -->

  <g fill="url(#nodeGlow)" filter="url(#glow)">

    <circle cx="450" cy="97" r="6"/>
    <circle cx="450" cy="177" r="6"/>

  </g>


  <!-- OUTPUT LAYER -->

  <g fill="url(#nodeGlow)" filter="url(#glow)">

    <circle cx="650" cy="72" r="6"/>
    <circle cx="650" cy="132" r="7"/>
    <circle cx="650" cy="192" r="6"/>

  </g>


  <!-- FINAL NODE -->

  <g filter="url(#strongGlow)">

    <!-- Radar rings -->

    <circle
      cx="810"
      cy="132"
      r="28"
      fill="none"
      stroke="#00E5FF"
      stroke-width="1"
      opacity="0.2">

      <animate
        attributeName="r"
        values="22;38"
        dur="2.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.6;0"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Main output -->

    <circle
      cx="810"
      cy="132"
      r="13"
      fill="#07151E"
      stroke="#00E5FF"
      stroke-width="2"/>

    <circle
      cx="810"
      cy="132"
      r="7"
      fill="url(#nodeGlow)">

      <animate
        attributeName="r"
        values="6;9;6"
        dur="1.4s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- LABELS -->

  <g
    font-family="Fira Code, monospace"
    font-size="9"
    fill="#00E5FF"
    opacity="0.5">

    <text x="55" y="63">INPUT</text>

    <text x="215" y="47">LAYER_01</text>

    <text x="405" y="67">NEURAL_CORE</text>

    <text x="610" y="47">LAYER_02</text>

    <text x="775" y="97">OUTPUT</text>

  </g>


  <!-- STATUS ROW -->

  <g font-family="Fira Code, monospace" font-size="8.5" fill="#4DE8FF" opacity="0.55">

    <circle cx="26" cy="219" r="2.5" fill="#3CFF7A"/>
    <text x="34" y="222">STATUS: ONLINE</text>

    <text x="775" y="222">v2.0.26</text>

  </g>


  <!-- FOOTER -->

  <text
    x="450"
    y="238"
    text-anchor="middle"
    font-family="Fira Code, monospace"
    font-size="14"
    letter-spacing="1"
    fill="#00E5FF"
    opacity="0.85">

    &lt; BUILDING INTELLIGENT SYSTEMS /&gt;

    <animate
      attributeName="opacity"
      values="0.45;1;0.45"
      dur="4s"
      repeatCount="indefinite"/>

  </text>

</svg>
