<svg width="900" height="260" viewBox="0 0 900 260"
xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#101e2d"/>
      <stop offset="45%" stop-color="#08111a"/>
      <stop offset="100%" stop-color="#030507"/>
    </radialGradient>

    <!-- Cyan glow -->
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DF9FF"/>
      <stop offset="45%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <!-- Data line -->
    <linearGradient id="lineGradient">
      <stop offset="0%" stop-color="#003B55"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#003B55"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow -->
    <filter id="strongGlow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#00E5FF"
        stroke-width="0.4"
        opacity="0.08"/>
    </pattern>

  </defs>


  <!-- BACKGROUND -->

  <rect width="900" height="260" fill="url(#bg)"/>

  <rect width="900" height="260" fill="url(#grid)"/>


  <!-- AMBIENT LIGHT -->

  <circle
    cx="450"
    cy="120"
    r="170"
    fill="#00E5FF"
    opacity="0.025">

    <animate
      attributeName="r"
      values="160;190;160"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- PARTICLES -->

  <g fill="#00E5FF" opacity="0.45">

    <circle cx="120" cy="35" r="1.2">
      <animate attributeName="opacity"
      values="0.1;0.8;0.1"
      dur="3s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="210" cy="210" r="1">
      <animate attributeName="opacity"
      values="0.2;1;0.2"
      dur="4s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="380" cy="30" r="1.3">
      <animate attributeName="opacity"
      values="0.1;0.9;0.1"
      dur="2.5s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="570" cy="220" r="1">
      <animate attributeName="opacity"
      values="0.1;0.8;0.1"
      dur="3.5s"
      repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="40" r="1.3">
      <animate attributeName="opacity"
      values="0.1;1;0.1"
      dur="4s"
      repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- CONNECTIONS -->

  <g
    stroke="url(#lineGradient)"
    stroke-width="1.2"
    opacity="0.38">

    <!-- Layer 1 -->

    <line x1="90" y1="75" x2="260" y2="55"/>
    <line x1="90" y1="75" x2="260" y2="120"/>
    <line x1="90" y1="75" x2="260" y2="185"/>

    <line x1="90" y1="170" x2="260" y2="55"/>
    <line x1="90" y1="170" x2="260" y2="120"/>
    <line x1="90" y1="170" x2="260" y2="185"/>


    <!-- Layer 2 -->

    <line x1="260" y1="55" x2="450" y2="85"/>
    <line x1="260" y1="55" x2="450" y2="165"/>

    <line x1="260" y1="120" x2="450" y2="85"/>
    <line x1="260" y1="120" x2="450" y2="165"/>

    <line x1="260" y1="185" x2="450" y2="85"/>
    <line x1="260" y1="185" x2="450" y2="165"/>


    <!-- Layer 3 -->

    <line x1="450" y1="85" x2="650" y2="60"/>
    <line x1="450" y1="85" x2="650" y2="120"/>
    <line x1="450" y1="85" x2="650" y2="180"/>

    <line x1="450" y1="165" x2="650" y2="60"/>
    <line x1="450" y1="165" x2="650" y2="120"/>
    <line x1="450" y1="165" x2="650" y2="180"/>


    <!-- OUTPUT -->

    <line x1="650" y1="60" x2="810" y2="120"/>
    <line x1="650" y1="120" x2="810" y2="120"/>
    <line x1="650" y1="180" x2="810" y2="120"/>

  </g>


  <!-- ANIMATED SIGNALS -->

  <g fill="#FFFFFF" filter="url(#strongGlow)">

    <circle r="3">

      <animateMotion
        dur="3s"
        repeatCount="indefinite"

        path="
        M90,75
        L260,120
        L450,85
        L650,120
        L810,120"/>

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle r="2.5">

      <animateMotion
        dur="3.8s"
        begin="1s"
        repeatCount="indefinite"

        path="
        M90,170
        L260,185
        L450,165
        L650,180
        L810,120"/>

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="3.8s"
        begin="1s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- INPUT NODES -->

  <g filter="url(#glow)">

    <circle cx="90" cy="75" r="8" fill="url(#nodeGlow)">
      <animate
        attributeName="r"
        values="7;10;7"
        dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="90" cy="170" r="8" fill="url(#nodeGlow)">
      <animate
        attributeName="r"
        values="7;10;7"
        dur="2.4s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- HIDDEN LAYER 1 -->

  <g fill="url(#nodeGlow)" filter="url(#glow)">

    <circle cx="260" cy="55" r="6"/>
    <circle cx="260" cy="120" r="7"/>
    <circle cx="260" cy="185" r="6"/>

  </g>


  <!-- CENTRAL AI CORE -->

  <g filter="url(#strongGlow)">

    <!-- Outer pulse -->

    <circle
      cx="450"
      cy="125"
      r="32"
      fill="none"
      stroke="#00E5FF"
      stroke-width="1"
      opacity="0.35">

      <animate
        attributeName="r"
        values="28;40;28"
        dur="3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.6;0;0.6"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Core -->

    <circle
      cx="450"
      cy="125"
      r="16"
      fill="#06131C"
      stroke="#00E5FF"
      stroke-width="2"/>

    <circle
      cx="450"
      cy="125"
      r="8"
      fill="url(#nodeGlow)">

      <animate
        attributeName="r"
        values="7;10;7"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- HIDDEN LAYER 2 -->

  <g fill="url(#nodeGlow)" filter="url(#glow)">

    <circle cx="450" cy="85" r="6"/>
    <circle cx="450" cy="165" r="6"/>

  </g>


  <!-- OUTPUT LAYER -->

  <g fill="url(#nodeGlow)" filter="url(#glow)">

    <circle cx="650" cy="60" r="6"/>
    <circle cx="650" cy="120" r="7"/>
    <circle cx="650" cy="180" r="6"/>

  </g>


  <!-- FINAL NODE -->

  <g filter="url(#strongGlow)">

    <!-- Radar rings -->

    <circle
      cx="810"
      cy="120"
      r="28"
      fill="none"
      stroke="#00E5FF"
      stroke-width="1"
      opacity="0.2">

      <animate
        attributeName="r"
        values="22;38"
        dur="2.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0.6;0"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Main output -->

    <circle
      cx="810"
      cy="120"
      r="13"
      fill="#07151E"
      stroke="#00E5FF"
      stroke-width="2"/>

    <circle
      cx="810"
      cy="120"
      r="7"
      fill="url(#nodeGlow)">

      <animate
        attributeName="r"
        values="6;9;6"
        dur="1.4s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- LABELS -->

  <g
    font-family="Fira Code, monospace"
    font-size="9"
    fill="#00E5FF"
    opacity="0.45">

    <text x="55" y="45">INPUT</text>

    <text x="215" y="35">LAYER_01</text>

    <text x="410" y="55">NEURAL_CORE</text>

    <text x="610" y="35">LAYER_02</text>

    <text x="775" y="85">OUTPUT</text>

  </g>


  <!-- FOOTER -->

  <text
    x="450"
    y="238"
    text-anchor="middle"
    font-family="Fira Code, monospace"
    font-size="14"
    letter-spacing="1"
    fill="#00E5FF"
    opacity="0.85">

    &lt; BUILDING INTELLIGENT SYSTEMS /&gt;

    <animate
      attributeName="opacity"
      values="0.45;1;0.45"
      dur="4s"
      repeatCount="indefinite"/>

  </text>

</svg>
