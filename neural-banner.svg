<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- connections -->
  <g stroke="#00E5FF" stroke-width="1" opacity="0.35">
    <line x1="90" y1="60" x2="290" y2="45"/>
    <line x1="90" y1="60" x2="290" y2="110"/>
    <line x1="90" y1="60" x2="290" y2="175"/>
    <line x1="90" y1="150" x2="290" y2="45"/>
    <line x1="90" y1="150" x2="290" y2="110"/>
    <line x1="90" y1="150" x2="290" y2="175"/>

    <line x1="290" y1="45" x2="490" y2="70"/>
    <line x1="290" y1="45" x2="490" y2="150"/>
    <line x1="290" y1="110" x2="490" y2="70"/>
    <line x1="290" y1="110" x2="490" y2="150"/>
    <line x1="290" y1="175" x2="490" y2="70"/>
    <line x1="290" y1="175" x2="490" y2="150"/>

    <line x1="490" y1="70" x2="690" y2="55"/>
    <line x1="490" y1="70" x2="690" y2="110"/>
    <line x1="490" y1="70" x2="690" y2="165"/>
    <line x1="490" y1="150" x2="690" y2="55"/>
    <line x1="490" y1="150" x2="690" y2="110"/>
    <line x1="490" y1="150" x2="690" y2="165"/>

    <line x1="690" y1="55" x2="820" y2="110"/>
    <line x1="690" y1="110" x2="820" y2="110"/>
    <line x1="690" y1="165" x2="820" y2="110"/>

    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- pulse traveling along a signal path -->
  <circle r="3" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="2.6s" repeatCount="indefinite"
      path="M90,60 L290,110 L490,70 L690,110 L820,110"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3.1s" begin="0.8s" repeatCount="indefinite"
      path="M90,150 L290,175 L490,150 L690,165 L820,110"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g filter="url(#glow)">
    <circle cx="90" cy="60" r="7" fill="url(#nodeGlow)"><animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="7" fill="url(#nodeGlow)"><animate attributeName="r" values="6;8;6" dur="2.3s" repeatCount="indefinite"/></circle>

    <circle cx="290" cy="45" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="110" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="175" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="1.9s" repeatCount="indefinite"/></circle>

    <circle cx="490" cy="70" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="150" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/></circle>

    <circle cx="690" cy="55" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="110" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="165" r="6" fill="url(#nodeGlow)"><animate attributeName="r" values="5;7;5" dur="1.95s" repeatCount="indefinite"/></circle>

    <circle cx="820" cy="110" r="8" fill="url(#nodeGlow)"><animate attributeName="r" values="7;9;7" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <text x="450" y="205" text-anchor="middle" font-family="Fira Code, monospace" font-size="15" fill="#00E5FF" opacity="0.85">
    &lt; building intelligent systems /&gt;
  </text>
</svg>
