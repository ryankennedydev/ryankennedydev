<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg2" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#050709"/>
    </radialGradient>
    <linearGradient id="nodeGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077FF"/>
    </linearGradient>
    <filter id="glow2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="420" height="420" fill="url(#bg2)"/>

  <!-- head-silhouette node cloud (points roughly outline a head + shoulders in profile-neutral form) -->
  <g id="pts" filter="url(#glow2)">
    <!-- outline -->
    <circle cx="210" cy="70" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="170" cy="80" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="250" cy="80" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="145" cy="110" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="275" cy="110" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="135" cy="150" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="285" cy="150" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="140" cy="190" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="280" cy="190" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="155" cy="225" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="265" cy="225" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="180" cy="250" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="240" cy="250" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="210" cy="260" r="4" fill="url(#nodeGlow2)"/>

    <!-- inner "processing" nodes -->
    <circle cx="185" cy="140" r="5" fill="url(#nodeGlow2)"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="140" r="5" fill="url(#nodeGlow2)"><animate attributeName="r" values="4;6;4" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="120" r="5" fill="url(#nodeGlow2)"><animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="165" r="5" fill="url(#nodeGlow2)"><animate attributeName="r" values="4;6;4" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="185" cy="190" r="5" fill="url(#nodeGlow2)"><animate attributeName="r" values="4;6;4" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="190" r="5" fill="url(#nodeGlow2)"><animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="205" r="6" fill="url(#nodeGlow2)"><animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/></circle>

    <!-- shoulders -->
    <circle cx="90" cy="330" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="330" cy="330" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="60" cy="380" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="360" cy="380" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="150" cy="300" r="4" fill="url(#nodeGlow2)"/>
    <circle cx="270" cy="300" r="4" fill="url(#nodeGlow2)"/>
  </g>

  <!-- connective mesh -->
  <g stroke="#00E5FF" stroke-width="0.8" opacity="0.4">
    <line x1="210" y1="70" x2="170" y2="80"/>
    <line x1="210" y1="70" x2="250" y2="80"/>
    <line x1="170" y1="80" x2="145" y2="110"/>
    <line x1="250" y1="80" x2="275" y2="110"/>
    <line x1="145" y1="110" x2="135" y2="150"/>
    <line x1="275" y1="110" x2="285" y2="150"/>
    <line x1="135" y1="150" x2="140" y2="190"/>
    <line x1="285" y1="150" x2="280" y2="190"/>
    <line x1="140" y1="190" x2="155" y2="225"/>
    <line x1="280" y1="190" x2="265" y2="225"/>
    <line x1="155" y1="225" x2="180" y2="250"/>
    <line x1="265" y1="225" x2="240" y2="250"/>
    <line x1="180" y1="250" x2="210" y2="260"/>
    <line x1="240" y1="250" x2="210" y2="260"/>

    <line x1="185" y1="140" x2="210" y2="120"/>
    <line x1="235" y1="140" x2="210" y2="120"/>
    <line x1="185" y1="140" x2="210" y2="165"/>
    <line x1="235" y1="140" x2="210" y2="165"/>
    <line x1="185" y1="140" x2="185" y2="190"/>
    <line x1="235" y1="140" x2="235" y2="190"/>
    <line x1="210" y1="165" x2="210" y2="205"/>
    <line x1="185" y1="190" x2="210" y2="205"/>
    <line x1="235" y1="190" x2="210" y2="205"/>

    <line x1="210" y1="260" x2="150" y2="300"/>
    <line x1="210" y1="260" x2="270" y2="300"/>
    <line x1="150" y1="300" x2="90" y2="330"/>
    <line x1="270" y1="300" x2="330" y2="330"/>
    <line x1="90" y1="330" x2="60" y2="380"/>
    <line x1="330" y1="330" x2="360" y2="380"/>
    <line x1="60" y1="380" x2="360" y2="380"/>

    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- traveling signal -->
  <circle r="3" fill="#ffffff" filter="url(#glow2)">
    <animateMotion dur="3s" repeatCount="indefinite"
      path="M210,70 L210,120 L210,165 L210,205 L210,260 L150,300 L90,330 L60,380"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="210" y="410" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#00E5FF" opacity="0.8">
    neural_signature.load()
  </text>
</svg>
